<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e27">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: file: https: http:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https: http:; connect-src 'self' https: http:; frame-src 'self' https: http:;">
    <title>Floating Jull</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Boot Screen -->
    <div id="boot-screen">
        <div class="boot-logo">
            <svg viewBox="0 0 100 100" width="84" height="84">
                <defs>
                    <linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#22D3EE"/>
                        <stop offset="50%" stop-color="#7C3AED"/>
                        <stop offset="100%" stop-color="#EC4899"/>
                    </linearGradient>
                </defs>
                <rect x="10" y="10" width="35" height="35" rx="8" fill="url(#bootGrad)" opacity="0.95"/>
                <rect x="55" y="10" width="35" height="35" rx="8" fill="url(#bootGrad)" opacity="0.75"/>
                <rect x="10" y="55" width="35" height="35" rx="8" fill="url(#bootGrad)" opacity="0.75"/>
                <rect x="55" y="55" width="35" height="35" rx="8" fill="url(#bootGrad)" opacity="0.55"/>
            </svg>
        </div>
        <div class="boot-name">Floating Jull</div>
        <div class="boot-spinner"></div>
    </div>

    <!-- Desktop -->
    <div id="desktop" class="hidden">
        <!-- Default wallpaper watermark (visible saat belum set wallpaper custom) -->
        <div id="desktop-default-watermark">
            <div class="watermark-main">FLOATING JULL</div>
        </div>
        <!-- Desktop icons -->
        <div id="desktop-icons">
            <div class="desktop-icon" data-app="tiktok">
                <div class="icon-img tiktok-icon" style="background:#000000;border:1.5px solid #FE2C55;">
                    <svg viewBox="0 0 24 24" width="32" height="32"><defs><linearGradient id="ttG1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#25F4EE"/><stop offset="100%" stop-color="#FE2C55"/></linearGradient></defs><path fill="url(#ttG1)" d="M14.5 5.2c.4 1.05 1.3 1.85 2.4 2.05v2.4c-.85 0-1.65-.25-2.4-.7v4.45c0 1.95-1.55 3.5-3.5 3.5s-3.5-1.55-3.5-3.5 1.55-3.5 3.5-3.5c.35 0 .7.05 1 .15v2.45c-.3-.15-.65-.25-1-.25-.95 0-1.7.8-1.7 1.75s.75 1.75 1.7 1.75 1.7-.8 1.7-1.75V5.2h2.3z"/></svg>
                </div>
                <div class="icon-label">TikTok</div>
            </div>
            <div class="desktop-icon" data-app="bubbleSettings">
                <div class="icon-img bubble-icon" style="background:linear-gradient(135deg,#22D3EE,#7C3AED);">
                    <svg viewBox="0 0 24 24" width="32" height="32"><circle cx="12" cy="12" r="9" fill="#fff" opacity="0.3"/><circle cx="9" cy="9" r="2.5" fill="#fff" opacity="0.9"/></svg>
                </div>
                <div class="icon-label">Floating Jull Bubble</div>
            </div>
            <div class="desktop-icon" data-app="tentang">
                <div class="icon-img tentang-icon" style="background:linear-gradient(135deg,#22D3EE,#7C3AED);">
                    <svg viewBox="0 0 24 24" width="32" height="32"><circle cx="12" cy="12" r="10" fill="#0a0e27" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="8" r="1.5" fill="#fff"/><path d="M11 11h2v7h-2z" fill="#fff"/></svg>
                </div>
                <div class="icon-label">Tentang</div>
            </div>
            <div class="desktop-icon" data-app="carapasang">
                <div class="icon-img carapasang-icon" style="background:linear-gradient(135deg,#22D3EE,#7C3AED);">
                    <svg viewBox="0 0 24 24" width="32" height="32"><rect x="2" y="5" width="20" height="14" rx="3" fill="#0a0e27" stroke="#fff" stroke-width="1.5"/><path d="M10 9l6 3-6 3z" fill="#fff"/></svg>
                </div>
                <div class="icon-label">Cara Pasang</div>
            </div>
            <div class="desktop-icon" data-app="scan">
                <div class="icon-img scan-icon" style="background:linear-gradient(135deg,#10B981,#06B6D4);">
                    <svg viewBox="0 0 24 24" width="32" height="32"><path fill="#fff" d="M4,4h6v2H6v4H4V4M14,4h6v6h-2V6h-4V4M4,14h2v4h4v2H4V14M18,14h2v6h-6v-2h4V14M12,10a2,2 0 1,0 0,4a2,2 0 0,0 0,-4z"/></svg>
                </div>
                <div class="icon-label">Scan</div>
            </div>
        </div>

        <!-- Windows container -->
        <div id="windows-container"></div>

        <!-- Taskbar -->
        <div id="taskbar">
            <div id="start-btn" class="taskbar-item">
                <svg viewBox="0 0 24 24" width="22" height="22">
                    <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient></defs>
                    <rect x="3" y="3" width="8" height="8" rx="1.5" fill="url(#sg)"/>
                    <rect x="13" y="3" width="8" height="8" rx="1.5" fill="url(#sg)"/>
                    <rect x="3" y="13" width="8" height="8" rx="1.5" fill="url(#sg)"/>
                    <rect x="13" y="13" width="8" height="8" rx="1.5" fill="url(#sg)"/>
                </svg>
            </div>
            <div id="taskbar-apps"></div>
            <div id="taskbar-tray">
                <div id="taskbar-bubble-btn" class="taskbar-item" title="Floating Jull Bubble">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient></defs>
                        <circle cx="12" cy="12" r="9" fill="url(#bg)" opacity="0.9"/>
                        <circle cx="9" cy="9" r="2" fill="#fff" opacity="0.6"/>
                    </svg>
                </div>
                <div id="taskbar-settings-btn" class="taskbar-item" title="Pengaturan">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="#22D3EE" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                    </svg>
                </div>
                <div id="taskbar-close-btn" class="taskbar-item hidden" title="Tutup jendela aktif">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <circle cx="12" cy="12" r="11" fill="#EF4444"/>
                        <path d="M7 7L17 17M17 7L7 17" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div id="taskbar-time">
                    <div id="taskbar-time-text">--:--</div>
                    <div id="taskbar-date-text">--/--/----</div>
                </div>
            </div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="hidden">
            <div class="start-search">
                <input type="text" id="start-search-input" placeholder="Cari aplikasi..." readonly>
            </div>
            <div class="start-section-title">Semua Aplikasi</div>
            <div class="start-apps-grid">
                <div class="start-app" data-app="tiktok">
                    <div class="start-app-icon" style="background:#000000;border:1.5px solid #FE2C55;border-radius:6px;">
                        <svg viewBox="0 0 24 24" width="24" height="24"><defs><linearGradient id="stG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#25F4EE"/><stop offset="100%" stop-color="#FE2C55"/></linearGradient></defs><path fill="url(#stG)" d="M14.5 5.2c.4 1.05 1.3 1.85 2.4 2.05v2.4c-.85 0-1.65-.25-2.4-.7v4.45c0 1.95-1.55 3.5-3.5 3.5s-3.5-1.55-3.5-3.5 1.55-3.5 3.5-3.5c.35 0 .7.05 1 .15v2.45c-.3-.15-.65-.25-1-.25-.95 0-1.7.8-1.7 1.75s.75 1.75 1.7 1.75 1.7-.8 1.7-1.75V5.2h2.3z"/></svg>
                    </div>
                    <div class="start-app-name">TikTok</div>
                </div>
                <div class="start-app" data-app="bubbleSettings">
                    <div class="start-app-icon" style="background:linear-gradient(135deg,#22D3EE,#7C3AED);border-radius:50%;">
                        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9" fill="#fff" opacity="0.3"/><circle cx="9" cy="9" r="2.5" fill="#fff" opacity="0.9"/></svg>
                    </div>
                    <div class="start-app-name">Floating Jull Bubble</div>
                </div>
                <div class="start-app" data-app="tentang">
                    <div class="start-app-icon" style="background:linear-gradient(135deg,#22D3EE,#7C3AED);border-radius:6px;">
                        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="#0a0e27" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="8" r="1.5" fill="#fff"/><path d="M11 11h2v7h-2z" fill="#fff"/></svg>
                    </div>
                    <div class="start-app-name">Tentang</div>
                </div>
                <div class="start-app" data-app="carapasang">
                    <div class="start-app-icon" style="background:linear-gradient(135deg,#22D3EE,#7C3AED);border-radius:6px;">
                        <svg viewBox="0 0 24 24" width="24" height="24"><rect x="2" y="5" width="20" height="14" rx="3" fill="#0a0e27" stroke="#fff" stroke-width="1.5"/><path d="M10 9l6 3-6 3z" fill="#fff"/></svg>
                    </div>
                    <div class="start-app-name">Cara Pasang</div>
                </div>
                <div class="start-app" data-app="scan">
                    <div class="start-app-icon" style="background:linear-gradient(135deg,#10B981,#06B6D4);border-radius:6px;">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="#fff" d="M4,4h6v2H6v4H4V4M14,4h6v6h-2V6h-4V4M4,14h2v4h4v2H4V14M18,14h2v6h-6v-2h4V14M12,10a2,2 0 1,0 0,4a2,2 0 0,0 0,-4z"/></svg>
                    </div>
                    <div class="start-app-name">Scan</div>
                </div>
            </div>
            <div class="start-footer">
                <div class="start-user">
                    <div class="start-user-avatar">J</div>
                    <div class="start-user-name">Jull</div>
                </div>
                <div class="start-power" id="start-power-btn" title="Keluar">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#22D3EE" d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0119 12a7 7 0 01-14 0c0-2.21.91-4.2 2.38-5.41L5.97 5.17A8.932 8.932 0 003 12a9 9 0 0018 0c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Window Template (used by wm.js) -->
    <template id="window-template">
        <div class="window">
            <div class="window-titlebar">
                <div class="window-title">
                    <span class="window-icon"></span>
                    <span class="window-title-text"></span>
                </div>
                <div class="window-controls">
                    <button class="window-btn window-minimize" title="Minimalkan">
                        <svg viewBox="0 0 10 10" width="10" height="10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                    <button class="window-btn window-maximize" title="Maksimalkan">
                        <svg viewBox="0 0 10 10" width="10" height="10"><rect x="0" y="0" width="10" height="10" stroke="currentColor" stroke-width="1" fill="none"/></svg>
                    </button>
                    <button class="window-btn window-close" title="Tutup">
                        <svg viewBox="0 0 10 10" width="10" height="10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/></svg>
                    </button>
                </div>
            </div>
            <div class="window-body"></div>
        </div>
    </template>

    <!-- Notification container -->
    <div id="notifications"></div>

    <script src="js/wm.js"></script>
    <script src="js/lighttools-bridge.js"></script>
    <script src="js/apps.js"></script>
    <script src="js/bubble.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
